<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>local-sso — Identity lab</title>
  <meta name="description" content="A local Microsoft Entra ID compatible OIDC provider and SSO test playground.">
  <meta name="theme-color" content="#030305">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('local-sso.theme') || localStorage.getItem('local-sso-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
          document.documentElement.className = savedTheme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', savedTheme === 'light' ? '#f8fafc' : '#030305');
        }
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="app" class="app-shell"></div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
