<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>local-sso — Mock Microsoft Entra ID & SSO Playground</title>
  <meta name="description" content="Single-binary local mock Microsoft Entra ID (OIDC) provider and SSO test playground. Developed by Sazzad Sazib (@sazzadsazib).">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('local-sso-theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="text-slate-100 min-h-screen font-sans antialiased selection:bg-orange-500 selection:text-white flex flex-col">
  <div id="cursor-glow" class="pointer-events-none fixed inset-0 z-0 overflow-hidden" aria-hidden="true"></div>
  <div id="app" class="relative z-10 flex flex-col flex-1"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
